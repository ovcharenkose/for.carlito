<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Some sweet hugs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page8">

  <a href="page4.html" class="back-btn" aria-label="Back">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>

  <!-- Декоративные сердечки -->
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh1">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh2">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh3">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh4">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh5">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh6">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh7">
  <img src="стикеры/сердце3.png" alt="" class="deco-heart dh8">

  <div class="page8-wrap">

    <!-- Верхний стикер sad.PNG -->
    <img src="стикеры/sad.PNG" alt="" class="top-sad-sticker">

    <!-- Окошко с текстом -->
    <div class="hello-box hug-text-box">
      This is how I would hold you if you were here, but you are far away…
    </div>

    <!-- Видео в красивом оформлении -->
    <div class="hug-video-wrap">
      <div class="hug-video-frame">
        <video
          id="hugVideo"
          class="hug-video"
          src="видео/huds.mp4"
          controls
          playsinline
          preload="metadata"
        ></video>
      </div>

      <!-- Нижний правый стикер cry.PNG -->
      <img src="стикеры/cry.PNG" alt="" class="bottom-cry-sticker">

      <a href="видео/huds.mp4" download="huds.mp4" class="download-btn hug-download">
        ⬇ Download
      </a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
